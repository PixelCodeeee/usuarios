# ==================== APPLICATION ====================
spring.application.name=usuarios-service

# ==================== SERVER ====================
server.port=8081

# ==================== EUREKA CLIENT ====================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

# ==================== MYSQL DATABASE (Clever Cloud) ====================
spring.datasource.url=jdbc:mysql://b3rghfedwh62vfwvqqou-mysql.services.clever-cloud.com:21959/b3rghfedwh62vfwvqqou?useSSL=true&requireSSL=false&serverTimezone=UTC
spring.datasource.username=uiuqvjgbkkytmvqx
spring.datasource.password=E6P9ifwI9dCiC2ZzWegj
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA ====================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== HIKARI CONNECTION POOL ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==================== H2 CONSOLE ====================
# DISABLED for production with MySQL
spring.h2.console.enabled=false

# ==================== LOGGING ====================
logging.level.com.pixelcode.usuarios=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.netflix.discovery=INFO

# ==================== VALIDACIÓN ====================
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# ==================== FORMATO DE RESPUESTAS ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# ==================== ACTUATOR ====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

